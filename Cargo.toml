[workspace]
resolver = "2"
members = [
  "crates/hud-core",
  "crates/hud-cli",
]

[workspace.package]
version = "1.5.0"
edition = "2024"
license = "MIT"
authors = ["Max"]
homepage = "https://github.com/maxlee/agy-hud"
repository = "https://github.com/maxlee/agy-hud"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
